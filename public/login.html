<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login — AnimeRush</title>
<link rel="stylesheet" href="style.css">
<style>

.auth-wrap{
  min-height:calc(100vh - 80px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 20px;
}

.auth-box{
  width:100%;
  max-width:420px;
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:20px;
  padding:28px;
  box-shadow:0 10px 40px rgba(0,0,0,.35);
}

.auth-box h1{
  font-family:'Rajdhani',sans-serif;
  font-size:38px;
  margin-bottom:22px;
  font-weight:800;
}

.auth-box input{
  width:100%;
  background:var(--bg3);
  border:1px solid var(--border2);
  color:var(--text);
  padding:14px;
  border-radius:12px;
  margin-bottom:14px;
  outline:none;
  font-size:14px;
}

.auth-box input:focus{
  border-color:var(--accent);
}

.auth-box button{
  width:100%;
  background:var(--accent);
  color:#fff;
  border:0;
  padding:14px;
  border-radius:12px;
  font-weight:700;
  cursor:pointer;
  font-size:14px;
  transition:.2s;
}

.auth-box button:hover{
  opacity:.92;
}

.google-btn{
  width:100%;
  margin-top:14px;
  background:#fff !important;
  color:#111 !important;
  border:0;
  border-radius:12px;
  padding:13px 14px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  font-weight:700;
  cursor:pointer;
  font-size:14px;
}

.google-btn img{
  width:20px !important;
  height:20px !important;
  max-width:20px !important;
  min-width:20px !important;
  object-fit:contain !important;
  display:block;
}

.auth-switch{
  margin-top:18px;
  font-size:13px;
  color:var(--text3);
  text-align:center;
}

.auth-switch span{
  color:var(--accent);
  cursor:pointer;
  font-weight:700;
}

@media(max-width:768px){

  .auth-wrap{
    padding:30px 16px;
    align-items:flex-start;
  }

  .auth-box{
    padding:22px;
    border-radius:18px;
  }

  .auth-box h1{
    font-size:32px;
  }

}

</style>
</head>

<body>
<div id="navbar"></div>

<div class="auth-wrap">
  <div class="auth-box">
    <h1 id="authTitle">Login</h1>

    <input type="text" id="name" placeholder="Your name" style="display:none">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">

    <button class="google-btn" onclick="googleLogin()">
  <img
    src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg"
    alt="Google">
  Continue with Google
</button>

    <div class="auth-switch">
      <span onclick="toggleAuth()" id="switchText">Create new account</span>
    </div>
  </div>
</div>

<footer id="footer"></footer>

<script src="app.js"></script>
<script type="module" src="firebase.js"></script>
<script>
let isSignup = false;

function toggleAuth(){
  isSignup = !isSignup;

  document.getElementById("authTitle").textContent = isSignup ? "Create Account" : "Login";
  document.getElementById("authBtn").textContent = isSignup ? "Sign Up" : "Login";
  document.getElementById("switchText").textContent = isSignup ? "Already have account? Login" : "Create new account";
  document.getElementById("name").style.display = isSignup ? "block" : "none";
}

function handleAuth(){
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  if(!email || !password){
    alert("Enter email and password");
    return;
  }

  if(isSignup){
    if(!name){
      alert("Enter your name");
      return;
    }

    const user = {name,email,password};
    localStorage.setItem("ar_user_" + email, JSON.stringify(user));
    localStorage.setItem("ar_current_user", email);

    location.href = "profile.html";
  }else{
    const saved = localStorage.getItem("ar_user_" + email);

    if(!saved){
      alert("Account not found");
      return;
    }

    const user = JSON.parse(saved);

    if(user.password !== password){
      alert("Wrong password");
      return;
    }

    localStorage.setItem("ar_current_user", email);
    location.href = "profile.html";
  }
}
</script>
</body>
</html>
