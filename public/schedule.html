<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Anime Schedule — AnimeRush</title>
<meta name="description" content="Weekly anime airing schedule on AnimeRush. Know exactly when your favourite anime episodes air each day of the week."/>
<meta name="robots" content="index,follow"/>
<link rel="canonical" href="https://animerush.in/schedule"/>
<link rel="stylesheet" href="style.css"/>
<style>
.sched-page-hero{
  background:var(--bg2);border-bottom:1px solid var(--border);padding:36px 0;
}
.sched-page-hero h1{font-family:'Rajdhani',sans-serif;font-size:38px;font-weight:700;margin-bottom:8px}
.sched-page-hero p{color:var(--text3);font-size:14px}
.day-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:28px;overflow-x:auto}
.day-tab{
  padding:12px 22px;font-size:14px;font-weight:600;color:var(--text3);
  border-bottom:3px solid transparent;cursor:pointer;transition:all .2s;white-space:nowrap;
}
.day-tab:hover{color:var(--text)}
.day-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.day-tab .today-dot{
  display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--green);margin-left:6px;vertical-align:middle;
}
.sched-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.sched-card{
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);
  display:flex;gap:13px;padding:12px;cursor:pointer;
  transition:border-color .2s,transform .15s;
}
.sched-card:hover{border-color:rgba(230,57,70,.4);transform:translateX(3px)}
.sched-thumb{width:64px;height:86px;border-radius:7px;overflow:hidden;flex-shrink:0;background:var(--bg4)}
.sched-thumb img{width:100%;height:100%;object-fit:cover}
.sched-body{flex:1;min-width:0}
.sched-title{font-size:14px;font-weight:600;line-height:1.35;margin-bottom:5px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sched-meta{font-size:12px;color:var(--text3);display:flex;gap:8px;flex-wrap:wrap}
.sched-ep-badge{
  display:inline-block;background:rgba(230,57,70,.12);color:var(--accent);
  font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;margin-top:5px;
}
.sched-time{
  display:flex;align-items:center;gap:5px;font-size:12px;color:var(--teal);font-weight:500;margin-top:4px;
}
.all-week{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.week-col{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 8px}
.week-col.today{border-color:rgba(230,57,70,.4)}
.week-day-name{font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:700;color:var(--accent);
  text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;text-align:center}
.week-item{font-size:11px;color:var(--text2);padding:5px 2px;border-bottom:1px solid var(--border);
  cursor:pointer;line-height:1.3;transition:color .15s}
.week-item:last-child{border-bottom:none}
.week-item:hover{color:var(--accent)}
@media(max-width:900px){.all-week{grid-template-columns:repeat(4,1fr)}}
@media(max-width:580px){.all-week{grid-template-columns:repeat(3,1fr)}.day-tab{padding:10px 14px;font-size:13px}}
</style>
</head>
<body>
<div id="navbar"></div>

<div class="sched-page-hero">
  <div class="page-wrap">
    <div class="breadcrumb" style="padding-top:0;margin-bottom:12px"><a href="/">Home</a> › <span>Schedule</span></div>
    <h1>📅 Weekly Anime Schedule</h1>
    <p>See what anime airs each day of the week. Never miss a new episode.</p>
    <div style="margin-top:14px;font-size:13px;color:var(--text3)">
      🟢 Today: <strong style="color:var(--green)" id="todayName"></strong>
      &nbsp;·&nbsp; All times in JST (Japan Standard Time)
    </div>
  </div>
</div>

<div class="page-wrap" style="padding-top:28px;padding-bottom:50px">

  <!-- DAY TABS -->
  <div class="day-tabs" id="dayTabs"></div>

  <!-- TODAY'S SCHEDULE (detail) -->
  <div id="schedContent">
    <div style="color:var(--text3);padding:30px;text-align:center">Loading schedule...</div>
  </div>

  <!-- AD -->
  <div style="text-align:center;margin:28px 0">
    <div class="ad-slot ad-resp">Advertisement — AdSense Banner</div>
  </div>

  <!-- FULL WEEK OVERVIEW -->
  <section class="section">
    <div class="sec-head"><div class="sec-title">📆 Full Week Overview</div></div>
    <div class="all-week" id="weekOverview">
      <div style="grid-column:1/-1;color:var(--text3);padding:20px;text-align:center">Loading...</div>
    </div>
  </section>

</div>

<footer id="footer"></footer>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
<script>
const DAYS = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
const DAY_LABELS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const FULL_DAYS  = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

// today: 0=Sun,1=Mon…
const jsDay   = new Date().getDay();
// convert to our 0=Mon index
const todayIdx = (jsDay+6)%7;

document.getElementById('todayName').textContent = FULL_DAYS[todayIdx];

// Build day tabs
document.getElementById('dayTabs').innerHTML = DAYS.map((d,i)=>`
  <div class="day-tab${i===todayIdx?' active':''}" onclick="switchDay(${i})" id="tab_${i}">
    ${DAY_LABELS[i]}${i===todayIdx?'<span class="today-dot"></span>':''}
  </div>`).join('');

let schedCache = {};

async function switchDay(idx){
  document.querySelectorAll('.day-tab').forEach((t,i)=>t.classList.toggle('active',i===idx));
  const day = DAYS[idx];
  const el  = document.getElementById('schedContent');
  el.innerHTML = '<div style="color:var(--text3);padding:30px;text-align:center">Loading...</div>';
  if(schedCache[day]){
    renderDaySchedule(schedCache[day], idx); return;
  }
  try{
    const d = await Jikan.schedule(day);
    schedCache[day] = d.data||[];
    renderDaySchedule(schedCache[day], idx);
  }catch(e){
    el.innerHTML=`<p style="color:var(--text3);padding:20px">Failed to load schedule for ${FULL_DAYS[idx]}.</p>`;
  }
}

function renderDaySchedule(list, idx){
  const el = document.getElementById('schedContent');
  if(!list.length){
    el.innerHTML=`<p style="color:var(--text3);padding:30px;text-align:center">No scheduled anime found for ${FULL_DAYS[idx]}.</p>`;
    return;
  }
  el.innerHTML = `
    <div style="font-size:14px;color:var(--text3);margin-bottom:16px">
      <strong style="color:var(--text)">${list.length}</strong> anime airing on <strong style="color:var(--accent)">${FULL_DAYS[idx]}</strong>
    </div>
    <div class="sched-list">
      ${list.map(a=>`
        <div class="sched-card" onclick="location.href='/anime/${a.mal_id}'">
          <div class="sched-thumb"><img src="${a.images?.jpg?.image_url||''}" alt="${a.title}" loading="lazy" onerror="imgFallback(this)"/></div>
          <div class="sched-body">
            <div class="sched-title">${a.title}</div>
            <div class="sched-meta">
              <span>${a.type||'TV'}</span>
              <span>${a.score?'⭐ '+a.score:''}</span>
              ${a.studios?.length?`<span>${a.studios[0].name}</span>`:''}
            </div>
            <div class="sched-ep-badge">Ep ${a.episodes||'?'}</div>
            ${a.broadcast?.time?`<div class="sched-time">🕐 ${a.broadcast.time} JST</div>`:''}
          </div>
        </div>`).join('')}
    </div>`;
}

async function loadWeekOverview(){
  const el = document.getElementById('weekOverview');
  const results = await Promise.allSettled(DAYS.map(d=>Jikan.schedule(d)));
  el.innerHTML = DAYS.map((d,i)=>{
    const list = results[i].status==='fulfilled' ? (results[i].value.data||[]).slice(0,6) : [];
    return `
      <div class="week-col${i===todayIdx?' today':''}">
        <div class="week-day-name">${DAY_LABELS[i]}</div>
        ${list.length
          ? list.map(a=>`<div class="week-item" onclick="location.href='/anime/${a.mal_id}'">${a.title}</div>`).join('')
          : '<div style="color:var(--text3);font-size:11px;text-align:center;padding:8px">—</div>'}
      </div>`;
  }).join('');
  // cache all
  results.forEach((r,i)=>{ if(r.status==='fulfilled') schedCache[DAYS[i]]=r.value.data||[]; });
}

// Load today on init
switchDay(todayIdx);
loadWeekOverview();
</script>
</body>
</html>
