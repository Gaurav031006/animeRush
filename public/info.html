<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>About Us — AnimeRush</title>
<meta name="description" content="About AnimeRush — the best free anime streaming site. Learn about our mission to bring you the best anime experience."/>
<link rel="stylesheet" href="style.css"/>
<style>
.info-page{max-width:800px;margin:40px auto;padding:0 24px 60px}
.info-page h1{font-family:'Rajdhani',sans-serif;font-size:36px;font-weight:700;margin-bottom:20px}
.info-page h2{font-family:'Rajdhani',sans-serif;font-size:24px;font-weight:700;margin:28px 0 10px;color:var(--accent)}
.info-page p{color:var(--text2);font-size:15px;line-height:1.85;margin-bottom:14px}
.info-page ul{color:var(--text2);font-size:15px;line-height:1.85;padding-left:20px;margin-bottom:14px}
.info-page ul li{margin-bottom:6px}
.info-page a{color:var(--accent)}
.info-page a:hover{text-decoration:underline}
.contact-form{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:28px;margin-top:20px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;color:var(--text3);margin-bottom:6px;font-weight:500}
.form-group input,.form-group textarea,.form-group select{
  width:100%;background:var(--bg4);border:1px solid var(--border2);color:var(--text);
  border-radius:7px;padding:10px 14px;font-size:14px;outline:none;
  font-family:'Inter',sans-serif;transition:border-color .2s;
}
.form-group input:focus,.form-group textarea:focus{border-color:var(--accent)}
.form-group textarea{resize:vertical;min-height:130px}
.submit-btn{background:var(--accent);border:none;color:#fff;border-radius:7px;padding:12px 28px;font-size:14px;font-weight:600;cursor:pointer;transition:background .2s}
.submit-btn:hover{background:var(--accent-h)}
.divider{border:none;border-top:1px solid var(--border);margin:28px 0}
</style>
</head>
<body>
<div id="navbar"></div>

<div class="info-page" id="pageContent">
  <!-- Content injected by JS based on URL -->
</div>

<footer id="footer"></footer>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
<script>
const PAGE = location.pathname.split('/').pop().replace('.html','');
const PAGES = {
  'about': {
    title: 'About AnimeRush',

      <h1>About AnimeRush 🎌</h1>
      <p>Welcome to <strong>AnimeRush.in</strong> — your #1 destination to watch anime online free in HD. We are a passionate team of anime fans dedicated to bringing you the best anime streaming experience.</p>

      <h2>Advertising</h2>
      <p>AnimeRush is supported by advertising through Google AdSense and affiliate partnerships. Ads help us keep the service free for everyone. We do not use intrusive pop-ups or redirect ads.</p>
      <h2>Contact Us</h2>
      <p>Have questions, suggestions or DMCA requests? Visit our <a href="/pages/contact.html">Contact page</a> or email us at <a href="mailto:contact@animerush.in">contact@animerush.in</a>.</p>`

          <div style="font-size:13px;color:var(--text3)">Community</div>

        </div>
      </div>
      <div class="contact-form">

        <div class="form-group"><label>Email Address</label><input type="email" id="cEmail" placeholder="you@example.com"/></div>
        <div class="form-group">
          <label>Subject</label>
          <select id="cSubject">
            <option>General Question</option>
            <option>Report a Bug</option>
            <option>Request an Anime</option>
            <option>Broken Video / Episode</option>

            <option>Advertise with Us</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-group"><label>Message</label><textarea id="cMsg" placeholder="Describe your issue or question..."></textarea></div>
        <button class="submit-btn" onclick="submitContact()">Send Message →</button>
      </div>`
  },
  'privacy': {
    title: 'Privacy Policy — AnimeRush',
    content: `

  },
  'terms': {

    content: `

  },
  'dmca': {
    title: 'DMCA Policy — AnimeRush',
    content: `
      <h1>DMCA / Copyright Policy ⚖️</h1>
      <p>AnimeRush respects the intellectual property rights of content creators and rights holders. We comply with the Digital Millennium Copyright Act (DMCA) and similar international copyright laws.</p>
      <h2>Important Notice</h2>
      <div style="background:rgba(230,57,70,.07);border:1px solid rgba(230,57,70,.2);border-radius:var(--radius);padding:16px 20px;margin:14px 0">
        <strong>AnimeRush does not store any video files on its own servers.</strong> All video content displayed on our website is embedded from third-party hosting services. We are an index/aggregator service only.
      </div>
      <h2>DMCA Takedown Request</h2>
      <p>If you are a copyright owner and believe that content on AnimeRush infringes your rights, you may submit a DMCA takedown notice to us. Your notice must include:</p>
      <ul>

      <p>If you believe your content was removed by mistake or misidentification, you may submit a counter-notice to <a href="mailto:dmca@animerush.in">dmca@animerush.in</a>.</p>
      <h2>Repeat Infringers</h2>
      <p>AnimeRush will terminate access for users who are found to be repeat infringers in accordance with the DMCA.</p>`
  }
};

// Render the right page
const data = PAGES[PAGE] || PAGES['about'];
document.title = data.title;
document.querySelector('meta[name="description"]')?.setAttribute('content', data.title + ' — AnimeRush');
document.getElementById('pageContent').innerHTML = `
  <div class="breadcrumb" style="padding-top:0">
    <a href="/">Home</a> › <span>${data.title.split('—')[0].trim()}</span>
  </div>
  ${data.content}`;

function submitContact(){
  const name = document.getElementById('cName')?.value.trim();
  const email = document.getElementById('cEmail')?.value.trim();
  const msg = document.getElementById('cMsg')?.value.trim();
  if(!name||!email||!msg){ showToast('Please fill all fields.'); return; }
  // In real site, send to Firebase / EmailJS / Formspree
  showToast('✅ Message sent! We\'ll reply within 24 hours.');
  document.getElementById('cName').value='';
  document.getElementById('cEmail').value='';
  document.getElementById('cMsg').value='';
}
</script>
</body>
</html>
